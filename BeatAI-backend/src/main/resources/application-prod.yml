spring:
  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:mysql://mysql:3306/beatai?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080

cors:
  allowed-origins:
    - http://localhost
    - http://localhost:80
    - http://localhost:5173
    - http://13.124.180.27

ai:
  server:
    url: http://ai:8000

youtube:
  api-key: ${YOUTUBE_API_KEY}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: http://localhost/api/auth/kakao/callback

app:
  frontend-url: http://localhost
